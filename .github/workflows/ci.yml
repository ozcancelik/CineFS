name: CI & Release Builds (macOS + Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

# Read-only by default; only the release job below gets write access.
permissions:
  contents: read

jobs:
  # Cheap Linux check that runs first: the version must be the same in Cargo.toml,
  # Info.plist and CineFS.iss, and on a tag push it must also match the tag (v1.2.3 -> 1.2.3).
  version-check:
    name: Version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            bash scripts/check_version.sh "${GITHUB_REF_NAME}"
          else
            bash scripts/check_version.sh
          fi

  test-and-build-macos:
    name: macOS (CineFS.app & CineFS.dmg)
    needs: version-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust unit tests
        run: cargo test --workspace
      - name: Build macOS App Bundle & DMG
        run: ./macos/build_app.sh
      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineFS-macOS-DMG
          if-no-files-found: error
          path: |
            macos/build/CineFS.dmg
            target/release/cinefs-cli

  test-and-build-windows:
    name: Windows (CineFS.exe & CineFS-Setup.exe)
    needs: version-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # cinefs-win embeds windows/deps/winfsp.msi via include_bytes!, so it must exist
      # before anything compiles. The file is gitignored (third-party binary).
      - name: Download WinFsp 2.0 runtime MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows/deps | Out-Null
          Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi" -OutFile windows/deps/winfsp.msi
          $hash = (Get-FileHash windows/deps/winfsp.msi -Algorithm SHA256).Hash
          if ($hash -ne "6324DC81194A6A08F97B6AECA303CF5C2325C53EDE153BAE9FC4378F0838C101") {
            throw "winfsp.msi SHA256 mismatch: $hash"
          }
      - name: Run Rust unit tests on Windows
        run: cargo test --workspace
      - name: Build Windows GUI, CLI, and Inno Setup Installer
        shell: pwsh
        run: ./windows/build_windows.ps1
      - name: Upload Windows Installer & Binaries
        uses: actions/upload-artifact@v4
        with:
          name: CineFS-Windows-Setup
          if-no-files-found: error
          path: |
            windows/build/CineFS-Setup.exe
            windows/build/CineFS.exe
            windows/build/cinefs-cli.exe

  # Only on a version tag (v*), after both platforms built and tested: create a DRAFT
  # GitHub Release with the DMG and the Windows installer attached. Nothing is public
  # until you open the draft on GitHub, edit the notes and press "Publish release".
  # File names stay fixed, so releases/latest/download/CineFS.dmg always points at the newest one.
  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-and-build-macos, test-and-build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List downloaded files
        run: find dist -type f | sort
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: CineFS ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/CineFS-macOS-DMG/**/CineFS.dmg
            dist/CineFS-Windows-Setup/**/CineFS-Setup.exe
